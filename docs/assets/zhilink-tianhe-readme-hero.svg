      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="0.58" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#eaf6ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3fbf"/>
      <stop offset="0.55" stop-color="#1769ee"/>
