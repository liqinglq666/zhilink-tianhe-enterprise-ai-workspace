    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e4ed8"/><stop offset=".55" stop-color="#1688ef"/><stop offset="1" stop-color="#10c8cc"/></linearGradient>
    <linearGradient id="nav" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#071f4b"/><stop offset="1" stop-color="#123b73"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#124c91" flood-opacity=".13"/></filter>
