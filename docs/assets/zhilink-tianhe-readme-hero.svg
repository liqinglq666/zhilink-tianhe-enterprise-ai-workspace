<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="600" viewBox="0 0 1800 600" role="img" aria-labelledby="title desc">
  <title id="title">智链天河 · Enterprise AI Workspace</title>
  <desc id="desc">把会议、合同、政策与执行，连成一条可落地的 AI 工作链。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.72" stop-color="#f8fbff"/><stop offset="1" stop-color="#e9f4ff"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123fd0"/><stop offset="0.55" stop-color="#0f7cf1"/><stop offset="1" stop-color="#05c7dc"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0477e8"/><stop offset="1" stop-color="#13d3c2"/></linearGradient>
    <linearGradient id="nav" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#071f4a"/><stop offset="1" stop-color="#153d76"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0a4ca3" flood-opacity="0.14"/></filter>
