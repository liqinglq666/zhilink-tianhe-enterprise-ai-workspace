<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">智链天河 · Enterprise AI Workspace</title>
  <desc id="desc">把会议、合同、政策与执行，连成一条可落地的 AI 工作链。</desc>
  <defs>
